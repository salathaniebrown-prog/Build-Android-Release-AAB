// Dynamic Git-Level Distributed Architecture Matrix
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

include ':app'

// Adaptive Path Initialization Verification
def capacitorDir = new File('capacitor-android/android')
if (capacitorDir.exists() && capacitorDir.list()?.length > 0) {
    logger.lifecycle("🧬 [Alstra Core]: Local git source structures active. Compiling from repository files.")
    include ':capacitor-android'
    project(':capacitor-android').projectDir = capacitorDir
} else {
    logger.lifecycle("📡 [Alstra Core]: Local submodule source unpopulated. Redirecting to cluster fallback layer.")
}

include ':capacitor-cordova-android-plugins'
project(':capacitor-cordova-android-plugins').projectDir = new File('capacitor-cordova-android-plugins')
