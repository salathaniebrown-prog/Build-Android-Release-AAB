buildscript {
    ext {
        compileSdkVersion = 34
        selectTargetSdkVersion = 34
        minSdkVersion = 22
        targetSdkVersion = 34
        androidxAppCompatVersion = '1.6.1'
        junitVersion = '4.13.2'
        androidxJunitVersion = '1.1.5'
        androidxEspressoCoreVersion = '3.5.1'
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy {
            force 'androidx.core:core-ktx:1.12.0'
        }
    }
}

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group ?: "com.astra.${project.name.replace('-', '.')}"
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
