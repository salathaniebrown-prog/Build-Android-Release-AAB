name: Build Android Release AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK Path
        run: |
          find . -type d -name "android" -exec sh -c 'echo "sdk.dir=$ANDROID_HOME" > "$0/local.properties"' {} \; || true
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Locate and Execute Gradle Build
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" -type f | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Gradle wrapper not found! Generating wrapper..."
            gradle wrapper
            GRADLEW_PATH="./gradlew"
          fi
          chmod +x "$GRADLEW_PATH"
          GRADLE_DIR=$(dirname "$GRADLEW_PATH")
          cd "$GRADLE_DIR"
          ./gradlew bundleRelease -x test --no-daemon --stacktrace

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: |
            **/build/outputs/bundle/release/*.aab
            **/outputs/bundle/release/*.aab
