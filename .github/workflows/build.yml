name: Alstra Vector Core CI

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets qiskit

      - name: Verify Python Vector Core Matrix
        run: |
          python3 -c "import websockets; print('[SUCCESS] Python vector stack initialized successfully')"
